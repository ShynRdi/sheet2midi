[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheet2midi"
version = "0.1.0"
description = "Open-source sheet music to MusicXML and multi-track MIDI pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Shayan Radi"}]
keywords = ["music", "midi", "musicxml", "omr", "sheet-music"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = ["mido>=1.3,<2"]

[project.optional-dependencies]
pdf = ["pypdfium2>=4.30,<5"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "build>=1.2,<2"]

[project.scripts]
sheet2midi = "sheet2midi.cli:main"

[project.urls]
Homepage = "https://github.com/ShynRdi/sheet2midi"
Repository = "https://github.com/ShynRdi/sheet2midi"
Issues = "https://github.com/ShynRdi/sheet2midi/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
