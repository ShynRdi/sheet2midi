name: OMR benchmark

on:
  workflow_dispatch:
    inputs:
      engine:
        description: OMR backend to benchmark
        required: true
        default: homr
        type: choice
        options:
          - homr
          - oemer
          - audiveris

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y musescore3
      - run: pip install -e '.[dev,pdf]'
      - name: Install selected Python OMR backend
        if: ${{ inputs.engine == 'homr' || inputs.engine == 'oemer' }}
        run: pip install ${{ inputs.engine }}
      - name: Render synthetic corpus
        run: python scripts/render_benchmark_corpus.py
      - name: Run benchmark
        if: ${{ inputs.engine != 'audiveris' }}
        run: sheet2midi benchmark benchmarks/corpus/manifest.json --engine ${{ inputs.engine }} --output benchmark-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ inputs.engine }}
          path: benchmark-out
